name: Tests Flutter (analyze + test)
# Avant, les tests Flutter ne tournaient qu'au déploiement web (push sur
# main) : un push sur une branche ou une PR partait sans filet. Ici, chaque
# push et chaque PR passent analyze + les ~85 tests (~2 min avec le cache).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
