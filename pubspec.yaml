name: khompas
description: "Le compagnon de ta prepa : colloscope, kholles, notes et plan de travail."
publish_to: "none"
version: 0.19.0+19

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^11.0.0
  flutter_local_notifications: ^22.0.0
  flutter_timezone: ^5.0.0
  http: ^1.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  shared_preferences: ^2.3.0
  timezone: ^0.11.0
  # Ouverture du protocole khode:// (passerelle vers l'app Khode quand elle
  # est installee sur l'appareil) et des liens externes.
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# Icone de l'app (rose des vents, assets/icone.png) : PAS de config globale
# ici — chaque workflow CI ne genere que le squelette de SA plateforme, donc
# chacun utilise son fichier flutter_launcher_icons-<plateforme>.yaml
# (une config globale planterait sur les dossiers absents).

flutter:
  uses-material-design: true
