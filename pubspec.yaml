name: khompas
description: "Le compagnon de ta prepa : colloscope, kholles, notes et plan de travail."
publish_to: "none"
version: 0.13.0+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^11.0.0
  flutter_local_notifications: ^22.0.0
  flutter_timezone: ^5.0.0
  http: ^1.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  shared_preferences: ^2.3.0
  timezone: ^0.11.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# Icone de l'app (rose des vents nanobanana) : les workflows CI lancent
# `dart run flutter_launcher_icons` apres flutter create pour generer
# toutes les tailles (iPhone, Android, favicon + PWA web).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icone.png"
  web:
    generate: true
    image_path: "assets/icone.png"
    theme_color: "#6B5CEB"
    background_color: "#6B5CEB"

flutter:
  uses-material-design: true
